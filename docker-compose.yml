version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: yuotcikom-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: yuotcikom-portfolio

  # Backend Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yuotcikom-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/yuotcikom-portfolio
      NODE_ENV: development
    volumes:
      - ./backend:/app
    command: npm start

  # Frontend Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yuotcikom-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
    command: npm start

volumes:
  mongodb_data:

networks:
  default:
    name: yuotcikom-network
